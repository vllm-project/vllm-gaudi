# Dependabot keeps dependencies patched and, together with SHA-pinned
# GitHub Actions, addresses the OpenSSF Scorecard "Pinned-Dependencies"
# and "Vulnerabilities" checks. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Python packaging metadata (requirements*.txt, pyproject.toml).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # GitHub Actions used by the workflows in .github/workflows.
  # Dependabot updates the pinned SHAs while preserving the human-readable
  # version comment, so actions can stay pinned and current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Container base images in the .cd/ Dockerfiles. This keeps the digest of the
  # SHA-pinned public UBI base image (tag + digest form) current: Dependabot
  # tracks the tag and opens PRs bumping the digest. First-party Gaudi images on
  # vault.habana.ai are parameterized/unpinned and are skipped automatically.
  - package-ecosystem: docker
    directory: /.cd
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
