name: Basic HPU test suite

# NOTE: keep the run-name format. pre-merge-trigger.yaml finds a PR's earlier
# runs by "#<pr_number> " (with the space) to cancel them, and people look up
# test runs by "PR #<pr_number> [<head_sha>]".
run-name: "PR #${{ inputs.pr_number }} [${{ inputs.head_sha }}]"

# pre-merge-trigger.yaml looks for the next line in the base branch's copy of
# this file. With it, the trigger sends nixl_changed and does the draft and
# behind-base checks itself.
# pre-merge-contract: 2

on:
  workflow_dispatch:
    inputs:
      pr_number:  { description: 'PR number',                     required: false, type: string }
      head_sha:   { description: 'PR head commit SHA',            required: true, type: string }
      base_ref:   { description: 'PR target branch',              required: true, type: string }
      pr_title:   { description: 'PR title',                      required: false, type: string }
      # is_draft and is_merge_group are unused but stay declared, so dispatches
      # from trigger runs that started before an update are still accepted.
      is_draft:   { description: 'Draft PR (true/false)',         required: true, type: string, default: 'false' }
      skip_tests:           { description: 'Skip Gaudi tests (true/false)',                  required: true,  type: string, default: 'false' }
      is_merge_group:       { description: 'Triggered from merge queue (true/false)',        required: true,  type: string, default: 'false' }
      use_hourly_runner:    { description: 'Use hourly-ci pool (maintainers only)',          required: false, type: string, default: 'false' }
      vllm_ref_override:    { description: 'Override upstream vllm checkout ref (branch/tag/SHA; maintainers only)', required: false, type: string, default: '' }
      nixl_changed:         { description: 'NIXL Dockerfile changed (true/false); build-tests it when true', required: false, type: string, default: 'true' }

# Least-privilege default; post-comment opts into pull-requests: write at the
# job level.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number || inputs.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  retrieve_head_sha:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    outputs:
      head_sha: ${{ steps.set_sha.outputs.head_sha }}
    steps:
      - name: Set Head SHA Output
        id: set_sha
        run: |
          echo "head_sha=${{ inputs.head_sha }}" >> "$GITHUB_OUTPUT"

  # --- NEW JOB ---
  # This job runs first on the self-hosted pool, picks a runner,
  # and outputs its name so all other jobs can target it.
  # hourly-ci is selected by the trigger when a maintainer's PR title contains
  # [FIX_FOR_VLLM_LATEST]; the boolean arrives as inputs.use_hourly_runner.
  discover_runner:
    runs-on: ${{ inputs.use_hourly_runner == 'true' && 'hourly-ci' || 'pr-ci' }}
    timeout-minutes: 720
    outputs:
      runner_name: ${{ steps.get_name.outputs.name }}
    steps:
      - name: Get runner name
        id: get_name
        run: |
          echo "This workflow will run on: ${{ runner.name }}"
          echo "name=${{ runner.name }}" >> "$GITHUB_OUTPUT"

  discover_tests:
    # --- UPDATED: Add discover_runner dependency ---
    needs: [discover_runner, retrieve_head_sha]
    # --- UPDATED: Run on the specific node ---
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    timeout-minutes: 720
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.retrieve_head_sha.outputs.head_sha }}
          clean: true # Ensure a clean workspace before checkout
      - name: Discover test functions
        id: set-matrix
        run: |
          # This command robustly discovers all functions in the script that match the 'run_*'
          # naming convention, excluding the main 'run_all_tests' function itself.
          # The final list is formatted into a JSON array required for the matrix strategy.
          TEST_FUNCTIONS=$( grep '^run_' ./tests/full_tests/ci_e2e_discoverable_tests.sh | \
                      awk '{print $1}' | \
                      sed 's/()//' | \
                      jq -R . | jq -s -c . )

          echo "Discovered test matrix: $TEST_FUNCTIONS"
          # Fail the job if no tests were found.
          if [ "$TEST_FUNCTIONS" = "[]" ]; then
            echo "::error::No test functions were discovered. Failing the workflow."
            exit 1
          fi
          echo "matrix=$TEST_FUNCTIONS" >> "$GITHUB_OUTPUT"

  discover_calibration_tests:
    needs: [discover_runner, retrieve_head_sha]
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    timeout-minutes: 720
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.retrieve_head_sha.outputs.head_sha }}
          clean: true
      - name: Discover calibration test functions
        id: set-matrix
        run: |
          TEST_FUNCTIONS=$( grep '^run_' ./tests/calibration_tests/ci_calibration_smoke_tests.sh | \
                      awk '{print $1}' | \
                      sed 's/()//' | \
                      jq -R . | jq -s -c . )

          echo "Discovered calibration test matrix: $TEST_FUNCTIONS"
          if [ "$TEST_FUNCTIONS" = "[]" ]; then
            echo "::error::No calibration test functions were discovered. Failing the workflow."
            exit 1
          fi
          echo "matrix=$TEST_FUNCTIONS" >> "$GITHUB_OUTPUT"

  pre-commit:
    # This job runs in parallel with the build job
    needs: [retrieve_head_sha]
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.retrieve_head_sha.outputs.head_sha }}
          clean: true # Ensure a clean workspace before checkout

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Add problem matchers
        run: |
          echo "::add-matcher::.github/workflows/matchers/actionlint.json"
          echo "::add-matcher::.github/workflows/matchers/mypy.json"

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files --hook-stage manual

  pre_merge_hpu_test_build:
    # --- UPDATED: Add discover_runner dependency ---
    needs: [pre-commit, discover_tests, discover_calibration_tests, discover_runner, retrieve_head_sha]
    if: inputs.skip_tests != 'true'
    # --- UPDATED: Run on the specific node ---
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    timeout-minutes: 720
    permissions:
      contents: read # Required to checkout code and read history
    outputs:
      target_commit: ${{ steps.checkout_vllm_upstream.outputs.TEST_VLLM_COMMIT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Fetch full history for accurate commit comparison
          ref: ${{ needs.retrieve_head_sha.outputs.head_sha }}
          clean: true # Ensure a clean workspace before checkout
      - name: Read Stable Commit from Target Branch
        id: read_stable_commit
        run: |
          TARGET_FILE="VLLM_STABLE_COMMIT"
          COMMIT_HASH=""

          # 1. Primary Check: Look in the current branch
          echo "INFO: Checking for '$TARGET_FILE' in the current branch..."
          if [ -f "$TARGET_FILE" ]; then
            COMMIT_HASH=$(tr -d '[:space:]' < "$TARGET_FILE")
            if [ -n "$COMMIT_HASH" ]; then
              echo "✅ Found stable commit in current branch: $COMMIT_HASH"
            else
              echo "::warning:: File '$TARGET_FILE' is empty in current branch. Proceeding to fallback."
            fi
          else
            echo "INFO: File not found in current branch. Proceeding to fallback."
          fi

          # 2. Fallback Check: Look in the remote branch if the first check failed
          if [ -z "$COMMIT_HASH" ]; then
            TARGET_BRANCH="vllm/last-good-commit-for-vllm-gaudi"
            echo "➡️ Fallback: Attempting to read '$TARGET_FILE' from branch '$TARGET_BRANCH'..."

            git fetch origin "$TARGET_BRANCH" --no-tags --depth=1 || true

            # Read file from the remote branch; suppress errors if not found
            COMMIT_HASH=$(git show "origin/$TARGET_BRANCH:$TARGET_FILE" 2>/dev/null) || COMMIT_HASH=""
            COMMIT_HASH=$(echo "$COMMIT_HASH" | tr -d '[:space:]')

            if [ -n "$COMMIT_HASH" ]; then
              echo "✅ Found stable commit in fallback branch: $COMMIT_HASH"
            else
              echo "::error:: Fallback failed. Could not find a valid commit hash in either location."
            fi
          fi

          # 3. Export the final result
          echo "VLLM_STABLE_COMMIT=$COMMIT_HASH" >> "$GITHUB_ENV"
      - name: Determine Target Commit
        id: determine_commit
        env:
          # [FIX_FOR_VLLM_CUSTOM=...] is parsed and gated on author_association
          # in pre-merge-trigger.yaml and arrives here as vllm_ref_override.
          PR_TITLE_ENV:         ${{ inputs.pr_title }}
          VLLM_REF_OVERRIDE:    ${{ inputs.vllm_ref_override }}
          USE_HOURLY_RUNNER:    ${{ inputs.use_hourly_runner }}
        run: |
          FINAL_TARGET="${VLLM_STABLE_COMMIT}"
          PR_TITLE="$PR_TITLE_ENV"
          echo "Pull Request Title: \"${PR_TITLE}\""

          if [[ -n "$VLLM_REF_OVERRIDE" ]]; then
            if [[ "$VLLM_REF_OVERRIDE" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "✅ [FIX_FOR_VLLM_CUSTOM] honoured; target = $VLLM_REF_OVERRIDE"
              FINAL_TARGET="$VLLM_REF_OVERRIDE"
            else
              echo "::error::Invalid vllm_ref_override: $VLLM_REF_OVERRIDE"
              exit 1
            fi
          elif [[ "$USE_HOURLY_RUNNER" == "true" ]]; then
            echo "✅ [FIX_FOR_VLLM_LATEST] honoured; target = vllm-upstream/main"
            FINAL_TARGET="vllm-upstream/main"
          elif [ -z "$FINAL_TARGET" ]; then
            echo "⚠️ No stable commit; defaulting to vllm-upstream/main"
            FINAL_TARGET="vllm-upstream/main"
          else
            echo "Using stable commit: $FINAL_TARGET"
          fi

          echo "TARGET_COMMIT=$FINAL_TARGET" >> "$GITHUB_ENV"
          echo "commit_ref=$FINAL_TARGET"   >> "$GITHUB_OUTPUT"
      - name: Add vLLM upstream as a remote and checkout target commit
        id: checkout_vllm_upstream
        run: |
          echo "Attempting to remove remote branch if it exists..."
          git remote remove vllm-upstream || true
          echo "add vllm-upstream remote..."
          git remote add vllm-upstream https://github.com/vllm-project/vllm.git
          echo "Checking out code from '$TARGET_COMMIT'..."
          git fetch vllm-upstream --depth=100
          git checkout "$TARGET_COMMIT"
          COMMIT_ID=$(git rev-parse HEAD)
          echo "TEST_VLLM_COMMIT=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          echo "TEST_VLLM_COMMIT=$COMMIT_ID" >> "$GITHUB_ENV"
          echo "Target commit ID for testing: $COMMIT_ID"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Fetch full history for accurate commit comparison
          ref: ${{ needs.retrieve_head_sha.outputs.head_sha }}
          clean: true # Ensure a clean workspace before checkout

      - name: Setup Docker environment and build image
        run: |
          echo "Attempting to build Docker image..."
          docker build \
            --no-cache \
            --build-arg "VLLM_COMMIT_ARG=$TEST_VLLM_COMMIT" \
            -t hpu-plugin-v1-test-env-pre-merge-${{ needs.retrieve_head_sha.outputs.head_sha }} \
            -f .github/Dockerfile.ci .
          echo "Docker image built successfully."

  hpu_unit_tests:
    # --- UPDATED: Add discover_runner dependency ---
    needs: [pre_merge_hpu_test_build, discover_runner, retrieve_head_sha]
    # --- UPDATED: Run on the specific node ---
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    timeout-minutes: 720
    steps:
      - name: Run pytest in tests/unit_tests
        run: |
          EXITCODE=1
          remove_docker_containers() { docker rm -f hpu-plugin-v1-test-unit-tests-${{ needs.retrieve_head_sha.outputs.head_sha }} || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU plugin v1 unit tests"
          docker run --rm --runtime=habana --name=hpu-plugin-v1-test-unit-tests-${{ needs.retrieve_head_sha.outputs.head_sha }} --network=host \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_HOME=/workspace/hf_cache \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -v /mnt/hf_cache:/workspace/hf_cache \
            hpu-plugin-v1-test-env-pre-merge-${{ needs.retrieve_head_sha.outputs.head_sha }} \
            /bin/bash -c "pytest -vvv --timeout=300 --durations=10 --durations-min=1.0 /workspace/vllm-gaudi/tests/unit_tests"

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"
  hpu_pd_tests:
    # --- UPDATED: Add discover_runner dependency ---
    needs: [pre_merge_hpu_test_build, hpu_unit_tests, discover_runner, retrieve_head_sha]
    # --- UPDATED: Run on the specific node ---
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    timeout-minutes: 720
    steps:
      - name: Run test scripts
        run: |
          EXITCODE=1
          remove_docker_containers() { docker rm -f hpu-plugin-v1-test-pd-tests-${{ needs.retrieve_head_sha.outputs.head_sha }} || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU plugin v1 nixl pd tests"
          docker run --rm --runtime=habana --name=hpu-plugin-v1-test-pd-tests-${{ needs.retrieve_head_sha.outputs.head_sha }} --network=host \
            --privileged \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_HOME=/workspace/hf_cache \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -v /mnt/hf_cache:/workspace/hf_cache \
            -v /mnt/wheels_cache:/tmp/wheels_cache \
            hpu-plugin-v1-test-env-pre-merge-${{ needs.retrieve_head_sha.outputs.head_sha }} \
            /bin/bash -c "
                pip install lm-eval[api] &&
                cd /workspace/vllm-gaudi/tests/unit_tests &&
                ./run_accuracy_test.sh
            "

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"
  hpu_perf_tests:
    # --- UPDATED: Add discover_runner dependency ---
    needs: [pre_merge_hpu_test_build, hpu_unit_tests, discover_runner, retrieve_head_sha]
    # --- UPDATED: Run on the specific node ---
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    timeout-minutes: 720
    steps:
      - name: Run test scripts
        run: |
          EXITCODE=1
          remove_docker_containers() { docker rm -f hpu-plugin-v1-test-perf-tests-${{ needs.retrieve_head_sha.outputs.head_sha }} || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU plugin v1 perf tests"
          docker run --rm --runtime=habana --name=hpu-plugin-v1-test-perf-tests-${{ needs.retrieve_head_sha.outputs.head_sha }} --network=host \
            --privileged \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -e HF_HOME=/workspace/hf_cache \
            -v /mnt/hf_cache:/workspace/hf_cache \
            hpu-plugin-v1-test-env-pre-merge-${{ needs.retrieve_head_sha.outputs.head_sha }} \
            /bin/bash "/workspace/vllm-gaudi/tests/full_tests/ci_perf_tests.sh"

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"
  hpu_dp_tests:
    # --- UPDATED: Add discover_runner dependency ---
    needs: [pre_merge_hpu_test_build, hpu_unit_tests, discover_runner, retrieve_head_sha]
    # --- UPDATED: Run on the specific node ---
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    timeout-minutes: 720
    steps:
      - name: Run test scripts
        run: |
          EXITCODE=1
          remove_docker_containers() { docker rm -f hpu-plugin-v1-test-dp-tests-${{ needs.retrieve_head_sha.outputs.head_sha }} || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU plugin v1 dp tests"
          docker run --rm --runtime=habana --name=hpu-plugin-v1-test-dp-tests-${{ needs.retrieve_head_sha.outputs.head_sha }} --network=host \
            --privileged \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_HOME=/workspace/hf_cache \
            -e VLLM_SKIP_WARMUP=true \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -v /mnt/hf_cache:/workspace/hf_cache \
            hpu-plugin-v1-test-env-pre-merge-${{ needs.retrieve_head_sha.outputs.head_sha }} \
            /bin/bash -c "python -u /workspace/vllm-gaudi/examples/data_parallel.py --dp-size 2 --tp-size 2"

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"
  e2e:
    # --- UPDATED: Add discover_runner dependency ---
    needs: [pre_merge_hpu_test_build, hpu_unit_tests, discover_tests, discover_runner, retrieve_head_sha]
    # --- UPDATED: Run on the specific node ---
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        # The list of test functions is dynamically populated from the output of the 'discover_tests' job.
        test_function: ${{ fromJson(needs.discover_tests.outputs.matrix) }}

    steps:
      - name: Run test suite - ${{ matrix.test_function }}
        run: |
          EXITCODE=1
          CONTAINER_NAME="hpu-plugin-test-e2e-${{ needs.retrieve_head_sha.outputs.head_sha }}-${{ matrix.test_function }}"
          # Ensure the container is removed upon exit, regardless of success or failure.
          remove_docker_containers() { docker rm -f $CONTAINER_NAME || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU plugin test: ${{ matrix.test_function }}"
          docker run --rm --runtime=habana --name=$CONTAINER_NAME --network=host \
            --privileged \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_HOME=/workspace/hf_cache \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -v /mnt/hf_cache:/workspace/hf_cache \
             hpu-plugin-v1-test-env-pre-merge-${{ needs.retrieve_head_sha.outputs.head_sha }} \
            /bin/bash "/workspace/vllm-gaudi/tests/full_tests/ci_e2e_discoverable_tests.sh" "${{ matrix.test_function }}"

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"

  calibration_tests:
    needs: [pre_merge_hpu_test_build, hpu_unit_tests, discover_calibration_tests, discover_runner, retrieve_head_sha]
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        test_function: ${{ fromJson(needs.discover_calibration_tests.outputs.matrix) }}

    steps:
      - name: Run calibration test - ${{ matrix.test_function }}
        run: |
          EXITCODE=1
          CONTAINER_NAME="hpu-plugin-test-calibration-${{ needs.retrieve_head_sha.outputs.head_sha }}-${{ matrix.test_function }}"
          remove_docker_containers() { docker rm -f $CONTAINER_NAME || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU calibration test: ${{ matrix.test_function }}"
          docker run --rm --runtime=habana --name=$CONTAINER_NAME --network=host \
            --privileged \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_HOME=/workspace/hf_cache \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -e VLLM_GAUDI_PREFIX=/workspace/vllm-gaudi \
            -v /mnt/hf_cache:/workspace/hf_cache \
             hpu-plugin-v1-test-env-pre-merge-${{ needs.retrieve_head_sha.outputs.head_sha }} \
            /bin/bash "/workspace/vllm-gaudi/tests/calibration_tests/ci_calibration_smoke_tests.sh" "${{ matrix.test_function }}"

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"

  calibration_arg_parsing_tests:
    needs: [pre_merge_hpu_test_build, discover_runner, retrieve_head_sha]
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    timeout-minutes: 720
    steps:
      - name: Run calibration arg parsing tests
        run: |
          EXITCODE=1
          CONTAINER_NAME="hpu-plugin-test-calibration-arg-parsing-${{ needs.retrieve_head_sha.outputs.head_sha }}"
          remove_docker_containers() { docker rm -f $CONTAINER_NAME || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running calibration arg parsing tests"
          docker run --rm --name=$CONTAINER_NAME \
             hpu-plugin-v1-test-env-pre-merge-${{ needs.retrieve_head_sha.outputs.head_sha }} \
            /bin/bash "/workspace/vllm-gaudi/tests/calibration_tests/test_calibrate_model_arg_parsing.sh"

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"

  # Build-test the production NIXL Dockerfile when the PR changes it. The
  # trigger detects the change and passes it as inputs.nixl_changed.
  build_nixl_dockerfile:
    needs: [discover_runner, retrieve_head_sha]
    if: inputs.nixl_changed == 'true'
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    timeout-minutes: 720
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.retrieve_head_sha.outputs.head_sha }}
          clean: true
      - name: Build nixl Dockerfile (validation only)
        run: |
          echo "Building .cd/Dockerfile.ubuntu.pytorch.vllm.nixl.latest to verify it builds correctly..."
          docker build \
            --no-cache \
            -t nixl-dockerfile-build-test \
            -f .cd/Dockerfile.ubuntu.pytorch.vllm.nixl.latest \
            .
          echo "Nixl Dockerfile build succeeded."
      - name: Cleanup test image
        if: always()
        run: docker rmi -f nixl-dockerfile-build-test || true

  pre_merge_hpu_test:
    # --- UPDATED: Add discover_runner dependency ---
    needs: [hpu_unit_tests, e2e, hpu_perf_tests, calibration_tests, calibration_arg_parsing_tests, discover_runner]
    # --- UPDATED: Run on the specific node ---
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    timeout-minutes: 720
    # This job is required to pass for pre-merge CI. By itself it does nothing, and will only pass if all jobs specified in "needs" list pass.
    steps:
      - name: Succeeded if all previous jobs passed
        run: echo "All previous jobs passed."
  # This is a new job, at the same level as hpu-test-suite
  post-comment:
    name: Post PR Comment
    # This job runs after hpu-test-suite completes
    needs: [pre_merge_hpu_test, pre_merge_hpu_test_build]
    runs-on: ubuntu-latest
    timeout-minutes: 720
    permissions:
      # Permissions are required on a per-job basis
      pull-requests: write
    steps:
      - name: Post Comment on Success
        if: inputs.is_merge_group != 'true' && inputs.pr_number != '' && needs.pre_merge_hpu_test.result == 'success'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          issue-number: ${{ inputs.pr_number }}
          body: |
            ### ✅ CI Passed
            Tested commit: **`${{ inputs.head_sha }}`**
            All checks passed successfully against the following vllm commit:
            **`${{ needs.pre_merge_hpu_test_build.outputs.target_commit }}`**

  cleanup_docker_image:
    name: Cleanup Docker Image
    if: always()
    needs: [discover_runner, hpu_unit_tests, hpu_pd_tests, hpu_perf_tests, hpu_dp_tests, e2e, calibration_tests, calibration_arg_parsing_tests]
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    timeout-minutes: 720
    steps:
      - name: Remove Docker image to free up space
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          echo "Cleaning up Docker images created by this workflow run..."
          docker rmi -f "hpu-plugin-v1-test-env-pre-merge-$HEAD_SHA" || true
