name: Pre-merge trigger

# Full head SHA, so approvers see exactly which commit they approve. Kept
# distinct from the dispatched run's "PR #<n> [<sha>]" title.
run-name: "Pre-merge for #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}: ${{ github.event.pull_request.title }}"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches:
      - main
      - releases/**

# Least-privilege default; execute_pre_merge opts into the actions/PR/issues
# scopes it needs at the job level.
permissions:
  contents: read

concurrency:
  group: pre-merge-trigger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute_pre_merge:
    runs-on: ubuntu-latest
    # Approval is required before this job starts; a rejected or expired
    # approval fails it.
    environment: pre-merge-approval
    timeout-minutes: 720
    permissions:
      actions: write        # dispatch workflows, read run and job status, cancel runs
      contents: read        # read the base branch's pre-merge.yaml, compare commits
      pull-requests: write  # read PR labels; post the "CI Blocked" comment
      issues: read          # listEventsForTimeline to verify skip-gaudi-tests labeler
    steps:
      - name: Dispatch, find run, and wait for result
        id: dispatch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.setFailed('No pull request in the event payload; nothing dispatched');
              return;
            }

            // Honour skip-gaudi-tests only if the *last* user who applied the
            // label has write/admin permission on the repo.
            async function skipTestsFromLabel(owner, repo, prNumber, labels) {
              if (!labels?.some(l => l.name === 'skip-gaudi-tests')) return 'false';
              try {
                const events = await github.paginate(
                  github.rest.issues.listEventsForTimeline,
                  { owner, repo, issue_number: parseInt(prNumber, 10), per_page: 100 },
                );
                const last = [...events].reverse().find(
                  e => e.event === 'labeled' && e.label?.name === 'skip-gaudi-tests',
                );
                if (!last?.actor?.login) {
                  core.setFailed('skip-gaudi-tests present but labeler unknown');
                  return 'false';
                }
                const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username: last.actor.login,
                });
                const allowed = ['admin', 'write'].includes(perm.permission);
                core.info(
                  `skip-gaudi-tests applied by ${last.actor.login} (${perm.permission}); ` +
                  (allowed ? 'honoured' : 'ignored'),
                );
                return String(allowed);
              } catch (e) {
                core.setFailed(`Could not verify skip-gaudi-tests labeler: ${e.message}; ignoring label`);
                return 'false';
              }
            }

            // Helper: cancel a dispatched run by id (best-effort)
            async function cancelDispatchedRun(id, why) {
              if (!id) return;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: id,
                });
                core.info(`Cancelled dispatched run ${id} (${why})`);
              } catch (e) {
                core.warning(`Failed to cancel run ${id}: ${e.message}`);
              }
            }

            // "CI Blocked" comment with fixed text only (no PR title, branch or
            // other PR data), then fail.
            async function blockCi(reason) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
                  body: '### 🚧 CI Blocked\n\n' +
                        'The main CI workflow was not started for the following reason:\n' +
                        `> ${reason}\n`,
                });
              } catch (e) {
                core.warning(`Could not post the CI Blocked comment: ${e.message}`);
              }
              core.setFailed(`CI blocked: ${reason}`);
            }

            // Legacy pre-merge.yaml: the result is the whole run's conclusion.
            async function waitForRun(id) {
              for (let i = 0; i < 4320; i++) {
                try {
                  const { data: run } = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner, repo: context.repo.repo, run_id: id,
                  });
                  if (run.status === 'completed') {
                    if (run.conclusion !== 'success')
                      core.setFailed(`pre-merge ${run.conclusion}: ${run.html_url}`);
                    return;
                  }
                  core.info(`Status: ${run.status} (${i + 1}/4320)`);
                } catch (e) {
                  core.warning(`getWorkflowRun transient error: ${e.message}`);
                }
                await new Promise(r => setTimeout(r, 10000));
              }
              await cancelDispatchedRun(id, 'trigger poll timeout (12 h)');
              core.setFailed('Timed out (12 h) waiting for pre-merge.yaml');
            }

            // Contract 2: the result is the pre_merge_hpu_test job alone, so the
            // check turns green as soon as the tests are done. Exactly one such
            // job in the latest attempt, and only 'success' passes. A failed
            // pre-commit cancels the run.
            async function waitForGate(id) {
              const GATE = 'pre_merge_hpu_test';
              for (let i = 0; i < 1440; i++) {
                try {
                  // Read the run first: if it had already ended, the job list
                  // below is final.
                  const { data: run } = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner, repo: context.repo.repo, run_id: id,
                  });
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    owner: context.repo.owner, repo: context.repo.repo, run_id: id,
                    filter: 'latest', per_page: 100,
                  });
                  if (jobs.some(j => j.name === 'pre-commit' && j.conclusion === 'failure')) {
                    await cancelDispatchedRun(id, 'pre-commit failed');
                    core.setFailed(`pre-commit failed: ${run.html_url}`);
                    return;
                  }
                  const gates = jobs.filter(j => j.name === GATE);
                  if (gates.length > 1) {
                    core.setFailed(`Found ${gates.length} ${GATE} jobs, expected one: ${run.html_url}`);
                    return;
                  }
                  if (gates.length === 1 && gates[0].status === 'completed') {
                    if (gates[0].conclusion !== 'success')
                      core.setFailed(`${GATE} ${gates[0].conclusion}: ${run.html_url}`);
                    return;
                  }
                  if (run.status === 'completed') {
                    core.setFailed(`pre-merge ${run.conclusion} without a ${GATE} result: ${run.html_url}`);
                    return;
                  }
                  core.info(`Status: ${run.status}, ${GATE}: ${gates[0]?.status ?? 'not started'} (${i + 1}/1440)`);
                } catch (e) {
                  core.warning(`Transient error while polling: ${e.message}`);
                }
                await new Promise(r => setTimeout(r, 30000));
              }
              await cancelDispatchedRun(id, 'trigger poll timeout (12 h)');
              core.setFailed(`Timed out (12 h) waiting for ${GATE}`);
            }

            const headSha   = pr.head.sha;
            const baseRef   = pr.base.ref;
            const prNumber  = String(pr.number);
            const prTitle   = pr.title;
            const isDraft   = String(pr.draft);
            const skipTests = await skipTestsFromLabel(
              context.repo.owner, context.repo.repo, prNumber, pr.labels,
            );

            // Only maintainers may steer runner pool or override upstream vllm ref.
            const TRUSTED = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const assoc   = pr.author_association;
            const trusted = TRUSTED.has(assoc);

            const useHourlyRunner = String(
              trusted && /\[FIX_FOR_VLLM_LATEST\]/.test(prTitle),
            );

            // [FIX_FOR_VLLM_CUSTOM=<ref>] — override upstream vllm checkout ref.
            // Gated on trusted author; value validated against a conservative
            // git-ref charset. Passed through to pre-merge.yaml as the
            // vllm_ref_override workflow_dispatch input.
            let vllmRefOverride = '';
            const rm = /\[FIX_FOR_VLLM_CUSTOM=([^\]]+)\]/.exec(prTitle);
            if (rm && trusted) {
              const candidate = rm[1];
              if (!/^[A-Za-z0-9._/-]+$/.test(candidate)) {
                core.setFailed(`[FIX_FOR_VLLM_CUSTOM=...] invalid ref: '${candidate}'`);
                return;
              }
              vllmRefOverride = candidate;
            } else if (rm && !trusted) {
              core.setFailed(`[FIX_FOR_VLLM_CUSTOM=...] in PR title from untrusted author (${assoc})`);
              return;
            }

            // The base branch's pre-merge.yaml carries this marker when it takes
            // the nixl_changed input, leaves the draft and behind-base checks to
            // this trigger and ends in the pre_merge_hpu_test gate job. Without
            // it (older release branches) dispatch and wait exactly as before.
            const CONTRACT_MARKER = '# pre-merge-contract: 2';
            const { data: wfFile } = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo,
              path: '.github/workflows/pre-merge.yaml', ref: baseRef,
            });
            const contract2 = Buffer.from(wfFile.content, 'base64').toString('utf8')
              .split(/\r?\n/).includes(CONTRACT_MARKER);
            core.info(`${baseRef}: pre-merge.yaml ${contract2 ? 'has' : 'lacks'} '${CONTRACT_MARKER}'`);

            // 0. Sweep any previous in-flight pre-merge.yaml runs for this PR.
            //    A prior trigger may have been killed by cancel-in-progress
            //    before it could clean up its own dispatched run.
            try {
              const { data: prev } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'pre-merge.yaml', branch: baseRef,
                event: 'workflow_dispatch', per_page: 50,
              });
              for (const r of prev.workflow_runs) {
                if (['completed', 'cancelled'].includes(r.status)) continue;
                if (r.display_title?.includes(`#${prNumber} `)) {
                  await cancelDispatchedRun(r.id, 'superseded by new push');
                }
              }
            } catch (e) {
              core.warning(`Could not list previous runs: ${e.message}`);
            }

            const inputs = {
              pr_number:            prNumber,
              head_sha:             headSha,
              base_ref:             baseRef,
              pr_title:             prTitle,
              is_draft:             isDraft,
              skip_tests:           skipTests,
              is_merge_group:       'false',  // still a required input of pre-merge.yaml
              use_hourly_runner:    useHourlyRunner,
              vllm_ref_override:    vllmRefOverride,
            };

            // Draft, behind-base and NIXL Dockerfile checks for a contract-2
            // pre-merge.yaml. API calls only; the PR's code is never checked out.
            if (contract2) {
              if (pr.draft) {
                await blockCi("This is a **Draft PR**. Please mark it as 'Ready for Review' to trigger the CI.");
                return;
              }
              const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner, repo: context.repo.repo,
                basehead: `${baseRef}...${headSha}`,
              });
              if (typeof cmp.behind_by !== 'number') {
                core.setFailed('Compare API returned no behind_by; cannot check the PR against its base');
                return;
              }
              if (cmp.behind_by > 0) {
                await blockCi('Your branch is **behind the base branch**. Please merge or rebase to get the latest changes.');
                return;
              }
              // A missing or truncated (300 files) list counts as changed.
              const NIXL_DOCKERFILE = '.cd/Dockerfile.ubuntu.pytorch.vllm.nixl.latest';
              const files = cmp.files;
              inputs.nixl_changed = String(
                !Array.isArray(files) || files.length >= 300 ||
                files.some(f => f.filename === NIXL_DOCKERFILE || f.previous_filename === NIXL_DOCKERFILE),
              );
              core.info(`nixl_changed=${inputs.nixl_changed}`);
            }

            // 1. Dispatch to base branch. return_run_details makes the API
            //    answer 200 with the new run's id instead of an empty 204.
            const { data: dispatched } = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'pre-merge.yaml',
              ref:   baseRef,
              return_run_details: true,
              inputs,
            });

            // 2. Follow only the run this dispatch created. Without its id the
            //    run cannot be told apart from other dispatches for the same
            //    commit, so fail instead of guessing.
            const runId = Number(dispatched?.workflow_run_id);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              // Cancel (never follow) in-flight runs with this PR's exact title,
              // so the unidentified run does not keep a Gaudi machine busy.
              const title = `PR #${prNumber} [${headSha}]`;
              for (let i = 0, done = false; i < 30 && !done; i++) {
                try {
                  const { data } = await github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner, repo: context.repo.repo,
                    workflow_id: 'pre-merge.yaml', branch: baseRef,
                    event: 'workflow_dispatch', per_page: 50,
                  });
                  for (const r of data.workflow_runs) {
                    if (r.display_title !== title || ['completed', 'cancelled'].includes(r.status)) continue;
                    await cancelDispatchedRun(r.id, 'dispatch returned no run id');
                    done = true;
                  }
                } catch (e) {
                  core.warning(`listWorkflowRuns transient error: ${e.message}`);
                }
                if (!done) await new Promise(r => setTimeout(r, 1000));
              }
              core.setFailed('Dispatch response has no workflow_run_id; cannot identify the test run');
              return;
            }
            core.info(`Dispatched run ${runId}: ${dispatched.html_url}`);
            core.setOutput('run_id', String(runId));

            // 3. Wait for the result (12 h max).
            if (contract2) await waitForGate(runId);
            else await waitForRun(runId);

      - name: Cancel dispatched run if trigger was cancelled or failed
        if: always() && steps.dispatch.outputs.run_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          TRIGGER_STATUS: ${{ job.status }}
        with:
          script: |
            const runId = parseInt(process.env.RUN_ID, 10);
            const triggerStatus = process.env.TRIGGER_STATUS;
            if (triggerStatus === 'success') return;
            try {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
              });
              if (run.status === 'completed') return;
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: runId,
              });
              core.info(`Cancelled dispatched run ${runId} (trigger ${triggerStatus})`);
            } catch (e) {
              core.warning(`Cleanup of run ${runId} failed: ${e.message}`);
            }
