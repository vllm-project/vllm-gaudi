# This workflow runs tests on a schedule and can also be triggered manually.
# It is designed to run each test suite in parallel for faster execution.

name: Hourly Commit Check and Tests

on:
  # The workflow is scheduled at the fast (8-hour) cadence; the 'gate' job below
  # decides at runtime whether a given tick actually proceeds. Effective cadence:
  #   - last real run PASSED  -> run every 8h (this schedule, every tick)
  #   - last real run FAILED  -> back off to once every 24h (skip 2 of every 3 ticks)
  schedule:
    # Runs at minute 0, every 8th hour (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'

  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch: {}

# Least-privilege default; the job that pushes the stable commit
# (store_last_stable_vllm_commit) opts into contents: write at the job level.
permissions:
  contents: read

jobs:
  # JOB 0: (NEW) Decides whether this scheduled tick should proceed.
  # Adaptive cadence: healthy pipeline runs every 8h; a failing pipeline backs
  # off to every 24h so we don't burn HPU runners re-running a known-broken state.
  gate:
    # Runs on a cheap GitHub-hosted runner so a "skip" never locks an HPU runner.
    runs-on: ubuntu-latest
    permissions:
      # read: query this workflow's previous runs and their jobs;
      # write: self-cancel the run on a skipped (backed-off) tick.
      actions: write
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      # ISO-8601 start time of the last real run; empty on bootstrap/manual runs.
      # setup_and_build uses this as the exact commit-diff window.
      last_started: ${{ steps.decide.outputs.last_started }}
    steps:
      - name: Decide whether to run
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"

          # Manual runs always proceed.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch -> running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only *scheduled* runs define the "hourly" health; manual dispatches
          # always run (handled above) and must not skew the cadence.
          RUNS=$(curl -fsSL -H "$AUTH" -H "$ACCEPT" \
            "$API/actions/workflows/hourly-ci.yaml/runs?branch=main&event=schedule&status=completed&per_page=30")

          # Find the most recent *real* run: one that actually executed the pipeline,
          # i.e. run_unit_tests finished as 'success' or 'failure'. This must ignore
          # both skipped ticks (run_unit_tests=skipped) AND backed-off ticks we
          # cancel (run_unit_tests=cancelled). Matching only "!= skipped" was the bug:
          # a cancelled tick looked like a failing "real" run, so the gate saw a fresh
          # non-success run every 8h and backed off forever.
          LAST_CONCLUSION=""
          LAST_STARTED=""
          for RUN_ID in $(echo "$RUNS" | jq -r '.workflow_runs[].id'); do
            JOBS=$(curl -fsSL -H "$AUTH" -H "$ACCEPT" \
              "$API/actions/runs/$RUN_ID/jobs?per_page=100")
            # run_unit_tests conclusion (empty if the job is absent/null). Selected
            # inside jq (no 'head', which would SIGPIPE under 'set -o pipefail').
            UT=$(echo "$JOBS" | jq -r 'first(.jobs[] | select(.name=="run_unit_tests") | .conclusion) // empty')
            case "$UT" in
              success|failure)
                # A run that actually produced a pass/fail verdict.
                LAST_CONCLUSION=$(echo "$RUNS" | jq -r ".workflow_runs[] | select(.id==$RUN_ID) | .conclusion")
                # Prefer run_started_at (when the run actually began); fall back to created_at.
                LAST_STARTED=$(echo "$RUNS" | jq -r ".workflow_runs[] | select(.id==$RUN_ID) | (.run_started_at // .created_at)")
                break
                ;;
            esac
          done

          if [ -z "$LAST_CONCLUSION" ]; then
            echo "No prior real run found -> running (bootstrap)."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last real run: conclusion=$LAST_CONCLUSION started_at=$LAST_STARTED"
          # Expose the last real run's start so setup_and_build can scope the
          # commit diff to exactly "since the last time we actually ran".
          echo "last_started=$LAST_STARTED" >> "$GITHUB_OUTPUT"

          if [ "$LAST_CONCLUSION" = "success" ]; then
            echo "Last real run passed -> 8h cadence -> running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Last real run did not pass -> 24h cadence. Only proceed once ~24h have
          # elapsed since that run started. Using elapsed time (not an exact hour
          # match) keeps this robust to GitHub's scheduled-event delivery drift.
          LAST_EPOCH=$(date -u -d "$LAST_STARTED" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_HOURS=$(( (NOW_EPOCH - LAST_EPOCH) / 3600 ))
          echo "Last real run failing; hours since it started: $AGE_HOURS"
          if [ "$AGE_HOURS" -ge 23 ]; then
            echo "Failing cadence, >=23h elapsed -> running (24h back-off tick)."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Failing cadence, only ${AGE_HOURS}h elapsed (<23h) -> skipping this tick."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cancel this run on a skipped tick
        # On a backed-off tick, cancel the run so it shows as 'cancelled' (grey)
        # in the Actions UI instead of a misleading green 'success'.
        if: steps.decide.outputs.should_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Adaptive back-off: cancelling this run so it is marked 'cancelled', not 'success'."
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel"
          # Cancellation is asynchronous: block so GitHub terminates this job as
          # 'cancelled' rather than letting the step finish and record 'success'.
          # If it hasn't taken effect within ~3 min, fail loudly (red beats green).
          for i in $(seq 1 18); do
            echo "Waiting for cancellation to take effect... ($i)"
            sleep 10
          done
          echo "::error::Run cancellation did not take effect in time." >&2
          exit 1

  # JOB 1: (NEW) Discovers an available runner and locks it for all subsequent jobs.
  discover_runner:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: hourly-ci # Picks any available runner from the 'hourly-ci' pool
    outputs:
      runner_name: ${{ steps.get_name.outputs.name }}
    steps:
      - name: Get runner name
        id: get_name
        # This command gets the unique name of the runner (e.g., "my-runner-123")
        # and saves it as an output variable
        run: |
          echo "This workflow will run on: ${{ runner.name }}"
          echo "name=${{ runner.name }}" >> "$GITHUB_OUTPUT"

  # JOB 2: (UPDATED) Sets up the environment and builds the Docker image.
  setup_and_build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    # <-- UPDATED: Now needs 'gate' (for the diff window), 'discover_tests' AND 'discover_runner'
    needs: [gate, discover_tests, discover_runner]
    # <-- UPDATED: Runs on the specific runner from the discover_runner job
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    permissions:
      contents: read # Required to checkout code and read history
    outputs:
      latest_commit: ${{ steps.latest_vllm_commit.outputs.LATEST_COMMIT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Fetch full history for accurate commit comparison
          fetch-depth: 0

      - name: Pre-Job Workspace Cleanup
        if: always()
        run: |
          echo "Attempting to remove remote branch if it exists..."
          git remote remove vllm-upstream || true
          echo "Cleanup complete."

      - name: Clean and Checkout repository again
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          clean: true # Ensure a clean workspace before checkout

      - name: Add vLLM upstream as a remote and fetch its history
        run: |
          git remote add vllm-upstream https://github.com/vllm-project/vllm.git
          git fetch vllm-upstream --depth=100

      - name: Calculate previous run time
        id: prev_run_time
        env:
          LAST_STARTED: ${{ needs.gate.outputs.last_started }}
        run: |
          # Scope the commit diff to exactly "since the last real run" so the
          # window tracks the adaptive cadence (8h when healthy, up to 24h during
          # back-off). Fall back to 24h when there is no prior run (bootstrap) or
          # on manual dispatch, where the gate exposes no start time.
          if [ -n "$LAST_STARTED" ]; then
            PREV_RUN_TIME=$(date -u -d "$LAST_STARTED" +"%Y-%m-%dT%H:%M:%SZ")
          else
            PREV_RUN_TIME=$(date -u -d "24 hours ago" +"%Y-%m-%dT%H:%M:%SZ")
          fi
          echo "Looking for commits since: $PREV_RUN_TIME"
          echo "PREV_RUN_TIME=$PREV_RUN_TIME" >> "$GITHUB_OUTPUT"

      - name: List commit differences since the last run
        run: |
          echo "Commits merged/pushed in vllm-project/vllm.git since ${{ steps.prev_run_time.outputs.PREV_RUN_TIME }}:"
          git log HEAD..vllm-upstream/main --pretty=format:"%h - %an, %ar : %s" --since="${{ steps.prev_run_time.outputs.PREV_RUN_TIME }}"

      - name: Get latest commit sha from vllm-upstream/main
        id: latest_vllm_commit
        run: |
          # Use the 'vllm-upstream/main' ref to log latest commit from that remote
          LATEST_COMMIT=$(git rev-parse vllm-upstream/main)
          echo "LATEST_COMMIT=$LATEST_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Latest commit from upstream vLLM: $LATEST_COMMIT"

      - name: Setup Docker environment and build image
        run: |
          echo "Attempting to build Docker image..."
          docker build \
            --no-cache \
            --build-arg VLLM_COMMIT_ARG=${{ steps.latest_vllm_commit.outputs.LATEST_COMMIT }} \
            -t hpu-plugin-v1-test-env-hourly-ci \
            -f .github/Dockerfile.ci .
          echo "Docker image built successfully."

  # JOB 3: (UPDATED)
  run_unit_tests:
    # <-- UPDATED: Now needs 'setup_and_build' AND 'discover_runner'
    needs: [setup_and_build, discover_runner]
    # <-- UPDATED: Runs on the specific runner
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    steps:
      - name: Run pytest in tests/unit_tests
        run: |
          EXITCODE=1
          remove_docker_containers() { docker rm -f hpu-plugin-v1-test-unit-tests-hourly-ci || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU plugin v1 unit tests"
          docker run --rm --runtime=habana --name=hpu-plugin-v1-test-unit-tests-hourly-ci --network=host \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_HOME=/workspace/hf_cache \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -v /mnt/hf_cache:/workspace/hf_cache \
            hpu-plugin-v1-test-env-hourly-ci \
            /bin/bash -c "pytest -vvv --timeout=300 --durations=10 --durations-min=1.0 /workspace/vllm-gaudi/tests/unit_tests"

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"

  # JOB 4: (UPDATED)
  discover_tests:
    # <-- UPDATED: Now needs 'discover_runner'
    needs: discover_runner
    # <-- UPDATED: Runs on the specific runner
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Discover test functions
        id: set-matrix
        run: |
          # This command robustly discovers all functions in the script that match the 'run_*'
          # naming convention, excluding the main 'run_all_tests' function itself.
          # The final list is formatted into a JSON array required for the matrix strategy.
          TEST_FUNCTIONS=$( grep '^run_' ./tests/full_tests/ci_e2e_discoverable_tests.sh | \
                      awk '{print $1}' | \
                      sed 's/()//' | \
                      jq -R . | jq -s -c . )

          echo "Discovered test matrix: $TEST_FUNCTIONS"
          # Fail the job if no tests were found.
          if [ "$TEST_FUNCTIONS" = "[]" ]; then
            echo "::error::No test functions were discovered. Failing the workflow."
            exit 1
          fi
          echo "matrix=$TEST_FUNCTIONS" >> "$GITHUB_OUTPUT"

  # JOB 5: (UPDATED)
  e2e:
    # <-- UPDATED: Now needs 'setup_and_build', 'discover_tests', AND 'discover_runner'
    needs: [setup_and_build, discover_tests, discover_runner]
    # <-- UPDATED: Runs on the specific runner
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    strategy:
      fail-fast: false
      matrix:
        # The list of test functions is dynamically populated from the output of the 'discover_tests' job.
        test_function: ${{ fromJson(needs.discover_tests.outputs.matrix) }}

    steps:
      - name: Run test suite - ${{ matrix.test_function }}
        run: |
          EXITCODE=1
          CONTAINER_NAME="hpu-plugin-test-${{ matrix.test_function }}-${{ github.run_id }}"
          # Ensure the container is removed upon exit, regardless of success or failure.
          remove_docker_containers() { docker rm -f $CONTAINER_NAME || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU plugin test: ${{ matrix.test_function }}"
          docker run --rm --runtime=habana --name=$CONTAINER_NAME --network=host \
            --privileged \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_HOME=/workspace/hf_cache \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -v /mnt/hf_cache:/workspace/hf_cache \
            hpu-plugin-v1-test-env-hourly-ci \
            /bin/bash "/workspace/vllm-gaudi/tests/full_tests/ci_e2e_discoverable_tests.sh" "${{ matrix.test_function }}"

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"

  # JOB 6: (UPDATED)
  run_data_parallel_test:
    # <-- UPDATED: Now needs 'setup_and_build' AND 'discover_runner'
    needs: [setup_and_build, discover_runner]
    # <-- UPDATED: Runs on the specific runner
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    steps:
      - name: Run Data Parallel test
        run: |
          EXITCODE=1
          remove_docker_containers() { docker rm -f hpu-plugin-v1-test-dp-tests-hourly-ci || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU plugin v1 dp tests"
          docker run --rm --runtime=habana --name=hpu-plugin-v1-test-dp-tests-hourly-ci --network=host \
            --privileged \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_HOME=/workspace/hf_cache \
            -e VLLM_SKIP_WARMUP=true \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -v /mnt/hf_cache:/workspace/hf_cache \
            hpu-plugin-v1-test-env-hourly-ci \
            /bin/bash -c "python -u /workspace/vllm-gaudi/examples/data_parallel.py --dp-size 2 --tp-size 2"

          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"

  # JOB 7: (UPDATED)
  run_pd_disaggregate_test:
    # <-- UPDATED: Now needs 'setup_and_build' AND 'discover_runner'
    needs: [setup_and_build, discover_runner]
    # <-- UPDATED: Runs on the specific runner
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    environment: approved-workflow
    steps:
      - name: Run PD disaggregate test
        run: |
          EXITCODE=1
          remove_docker_containers() { docker rm -f hpu-plugin-v1-test-pd-tests-hourly-ci || true; }
          trap 'remove_docker_containers; exit $EXITCODE;' EXIT
          remove_docker_containers

          echo "Running HPU plugin v1 nixl pd tests"
          docker run --rm --runtime=habana --name=hpu-plugin-v1-test-pd-tests-hourly-ci --network=host \
            --privileged \
            -e HABANA_VISIBLE_DEVICES=all \
            -e HF_HOME=/workspace/hf_cache \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -v /mnt/hf_cache:/workspace/hf_cache \
            -v /mnt/wheels_cache:/tmp/wheels_cache \
            hpu-plugin-v1-test-env-hourly-ci \
            /bin/bash -c "
              pip install lm-eval[api] &&
              cd /workspace/vllm-gaudi/tests/unit_tests &&
              ./run_accuracy_test.sh
            "
          EXITCODE=$?
          echo "Test script exited with code: $EXITCODE"

  # JOB 8: (UPDATED)
  store_last_stable_vllm_commit:
    # <-- UPDATED: Now needs all test jobs AND 'discover_runner'
    needs: [setup_and_build, run_unit_tests, e2e, run_data_parallel_test, run_pd_disaggregate_test, discover_runner]
    # <-- UPDATED: Runs on the specific runner
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    permissions:
      contents: write # Permission is required to push a commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: vllm/last-good-commit-for-vllm-gaudi
          fetch-depth: 0 # Fetch full history to ensure we can push changes

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Store last stable vllm commit sha
        run: |
          LATEST_COMMIT_SHA=${{ needs.setup_and_build.outputs.latest_commit }}
          echo "Storing latest stable vLLM commit SHA: $LATEST_COMMIT_SHA"
          echo "$LATEST_COMMIT_SHA" > VLLM_STABLE_COMMIT

          # Only commit and push if the file has changed to avoid empty commits
          git add VLLM_STABLE_COMMIT
          git commit --allow-empty -m "Update stable vLLM commit to ${LATEST_COMMIT_SHA}"

          echo "Pushing changes to remote branch..."
          # Explicitly set the remote URL with the token to prevent hanging on auth
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push --force origin HEAD:vllm/last-good-commit-for-vllm-gaudi

  cleanup_docker_image:
    name: Cleanup Docker Image
    # Run whenever a runner was actually locked (even if later jobs failed), but
    # never when discover_runner was skipped (gate said no) or failed -- in those
    # cases runner_name is empty and this job would fail to start.
    if: always() && needs.discover_runner.result == 'success'
    needs: [discover_runner, run_unit_tests, e2e, run_data_parallel_test, run_pd_disaggregate_test]
    runs-on: ${{ needs.discover_runner.outputs.runner_name }}
    steps:
      - name: Remove Docker image to free up space
        run: |
          echo "Cleaning up Docker images created by this workflow run..."
          docker rmi -f hpu-plugin-v1-test-env-hourly-ci || true
